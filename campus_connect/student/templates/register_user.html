<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .conatiner {
            height: 100%;
            display: flex;
            flex-direction: row;
        }

        .photo {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .images img {
            width: 90vh;
            height: auto;
            border-radius: 20px;
        }

        .form_ {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .login_form input[type="text"],
        .login_form input[type="email"],
        .login_form input[type="password"],
        .register_form input {
            width: 400px;
            padding: 15px;
            margin-bottom: 17px;
            border: 1px solid #686868;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .login_form p,
        .register_form p {
            margin-top: 0;
            text-align: right;
        }

        .login_form a,
        .register_form a {
            text-decoration: none;
        }

        button {
            width: 400px;
            border: none;
            background-color: black;
            color: white;
            border-radius: 20px;
            margin-left: 10px;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="conatiner">

        <div class="photo">

            <div class="images">
                <img src="https://i.pinimg.com/736x/4f/8c/8b/4f8c8b7b3fe7e678093f4277ca9c6ff4.jpg" alt="">
            </div>

        </div>

        <div class="form_">

            <div class="register_form">
                <h1>Create an Account!</h1>

                <!-- Django Form Integration -->
                <form action="{% url 'register' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                
                        {{ form.username }}
                    </div>
                    <div class="form-group">
                        
                        {{ form.email }}
                    </div>
                    <div class="form-group">
                       
                        {{ form.password1 }}
                    </div>
                    <div class="form-group">
                       
                        {{ form.password2 }}
                    </div>
                    <div class="form-group">
                        <button type="submit">Register</button>
                    </div>
                </form>
            </div>

        </div>

    </div>

</body>

</html>
