{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>{% block title %}Campus Connect{% endblock %}</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background: linear-gradient(to bottom, #e3f2fd, #c8e6c9);
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }

      .navbar {
        background: linear-gradient(120deg, #42a5f5 0%, #66bb6a 100%);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 0.5rem 1rem;
      }

      .navbar-brand {
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff !important;
        display: flex;
        align-items: center;
      }

      .navbar-brand i {
        margin-right: 0.5rem;
        font-size: 1.8rem;
      }

      .nav-link {
        color: #fff !important;
        transition: all 0.3s ease;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        margin: 0 0.2rem;
      }

      .nav-link:hover, .nav-link.active {
        color: #42a5f5 !important;
        background-color: #fff;
      }

      .nav-link i {
        margin-right: 0.3rem;
      }

      .form-control {
        border-radius: 30px;
        border: none;
        padding-left: 1rem;
      }

      .btn-outline-success {
        border-color: #fff;
        color: #fff;
        border-radius: 30px;
        padding: 0.375rem 1rem;
        transition: all 0.3s ease;
      }

      .btn-outline-success:hover {
        background-color: #fff;
        border-color: #fff;
        color: #42a5f5;
      }

      .container-fluid {
        max-width: 1200px;
        margin: 0 auto;
      }

      main {
        padding: 20px;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
      }

      footer {
        background: linear-gradient(120deg, #66bb6a 0%, #42a5f5 100%);
        color: #fff;
        text-align: center;
        padding: 10px 20px;
        margin-top: 30px;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
      }

      footer a {
        color: #dcedc8;
        text-decoration: none;
        font-weight: bold;
      }

      footer a:hover {
        text-decoration: underline;
      }

      .profil {
        height: 23px;
        width: 23px;
        object-fit: cover;
        border-radius: 50%;
      }

      @media (max-width: 991px) {
        .navbar-nav {
          margin-top: 1rem;
        }
        .nav-link {
          text-align: center;
          margin: 0.2rem 0;
        }
        .form-inline {
          justify-content: center;
          margin-top: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap"></i>Campus Connect</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/' %}active{% endif %}"
                aria-current="page"
                href="{% url 'home' %}"><i class="fas fa-home"></i>Home</a
              >
            </li>
            {% if not user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="#"><i class="fas fa-sign-in-alt"></i>Login</a>
            </li>
            {% endif %}
            
            <li class="nav-item">
              <a class="nav-link" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i>Logout</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'notice' %}"><i class="fas fa-bullhorn"></i>Announcement</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'profile' %}">
                <img class="profil" src="https://img.icons8.com/?size=100&id=14736&format=png&color=000000" alt="Profile">
              </a>
            </li>
          </ul>
          <form method="get" action="/search" class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
              name="query"
              id="query"
            />
            <button class="btn btn-outline-success" type="submit">
              <i class="fas fa-search"></i>
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Content Block -->
    <main class="container my-4">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Campus Connect. Made with ❤️. <a href="#">Contact Us</a></p>
    </footer>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
